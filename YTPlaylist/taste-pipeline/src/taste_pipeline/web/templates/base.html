<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Taste Pipeline{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css" />
    <script src="/static/vendor/htmx.min.js" defer></script>
    <script src="/static/vendor/htmx-json-enc.js" defer></script>
  </head>
  <body>
    <header id="action-bar">
      <span id="app-name">Taste Pipeline</span>
      {% block action_bar %}{% endblock %}
    </header>
    <nav id="main-nav">
      <a href="/" id="nav-dashboard">Dashboard</a>
      <a href="/triage" id="nav-triage">Triage</a>
      <a href="/check" id="nav-check">Check</a>
      <a href="/" id="nav-index">Index</a>
      <a href="/settings" id="nav-settings">Settings</a>
    </nav>
    <main id="content">{% block content %}{% endblock %}</main>
    <footer id="status-bar">
      Server: {{ server_host }}:{{ server_port }}
    </footer>
  </body>
</html>
